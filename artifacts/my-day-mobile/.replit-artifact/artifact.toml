kind = "mobile"
previewPath = "/my-day-mobile/"
title = "My Day AI Mobile"
description = "A mobile companion to My Day AI that lets users check off tasks, capture quick thoughts, and browse projects on the go. Syncs with the same backend as the web app via the shared API."
version = "1.0.0"
id = "artifacts/my-day-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/my-day-mobile/" ]
localPort = 18666

[services.development]
run = "pnpm --filter @workspace/my-day-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-day-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/my-day-mobile", "run", "serve" ]

[services.env]
PORT = "18666"
BASE_PATH = "/my-day-mobile/"
